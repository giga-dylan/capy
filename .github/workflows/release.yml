# Builds the macOS app and uploads the DMG + zip to a draft GitHub release.
#
# Trigger: push a tag like v0.2.0 (the version in package.json must match), or run it manually.
#
# Signing is automatic once these repository secrets exist (Settings → Secrets → Actions):
#   MAC_CERTIFICATE_P12       base64 of your "Developer ID Application" certificate (.p12)
#   MAC_CERTIFICATE_PASSWORD  the .p12 password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   for notarization
# Without them the app is ad-hoc signed (users approve it once in System Settings).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15 # Apple Silicon
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match package.json version $version"
            exit 1
          fi

      # postinstall downloads the pinned Ollama and opencode builds into resources/bin.
      - run: npm ci

      - run: npm run typecheck

      - name: Build and upload to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # electron-builder treats an empty CSC_LINK as "no certificate" only if it's unset.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          node scripts/dist.mjs --publish always

      - uses: actions/upload-artifact@v4
        with:
          name: capy-mac
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 14
